    let bool16 = false
    let bool17 = false
    let bool18 = false
    let bool20 = false
    let bool22 = false
    let bool23 = false
    let bool26 = false

    let data;
    let mapJS = L.map('map').setView([23.7387885, -99.1466166], 12);

    let tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(mapJS);

    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js'
    
    // If you enabled Analytics in your project, add the Firebase SDK for Google Analytics
    import { getAnalytics } from 'https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics.js'

    // Add Firebase products that you want to use
    import { getAuth } from 'https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js'
    import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js'
    import { getStorage } from 'https://www.gstatic.com/firebasejs/10.9.0/firebase-storage.js';

    const firebaseConfig = {
      apiKey: "AIzaSyCVnmjciwHk4GvGjzzg4uxWwss8s3HZeZ8",
      authDomain: "rutas-victoria-0.firebaseapp.com",
      databaseURL: "https://rutas-victoria-0-default-rtdb.firebaseio.com",
      projectId: "rutas-victoria-0",
      storageBucket: "rutas-victoria-0.appspot.com",
      messagingSenderId: "107711688385",
      appId: "1:107711688385:web:4603ad2f22dbc8ade76e40",
      measurementId: "G-0BLGHQ9T6H"
    };
    
    const app = initializeApp(firebaseConfig);

    const db = getDatabase()

    try{
      const distanceRef = ref(db, 'rutasweb')
      onValue(distanceRef, (snapshot) => {
        data = snapshot.val()
        
        //cargarMapa(data.root)
        cargarRutas()
      })
    } catch (error){
      console.error(error)
    }
    

    function cargarRutas(){

      let arrajson = data.root.features

      arrajson.forEach(element => {
        let coordinates = []

        element.geometry.coordinates.forEach(arr => {
          //console.log(arr)
          let point = new L.LatLng(arr[1], arr[0])
          coordinates.push(point)
        }) 
        let color = element.properties.color

        try {
          switch(element.id){
          case '01':
          polyRB = L.polyline(coordinates, {color: color}).addTo(mapJS);
          boolRB = true
            break;
          case '02':
          poly8 = L.polyline(coordinates, {color: color}).addTo(mapJS);
          bool8 = true
            break;
          case '03':
          poly7 = L.polyline(coordinates, {color: color}).addTo(mapJS);
          bool7 = true
            break;
          case '04':
          poly23 = L.polyline(coordinates, {color: color}).addTo(mapJS);
          bool23 = true
            break;
          case '05':
          poly22 = L.polyline(coordinates, {color: color}).addTo(mapJS);
          bool22 = true
            break;
          case '06':
          poly20 = L.polyline(coordinates, {color: color}).addTo(mapJS);
          bool20 = true
            break;
          case '07':
          poly2 = L.polyline(coordinates, {color: color}).addTo(mapJS);
          bool2 = true
            break;
          case '08':
          poly18 = L.polyline(coordinates, {color: color}).addTo(mapJS);
          bool18 = true
            break;
          case '09':
          poly17 = L.polyline(coordinates, {color: color}).addTo(mapJS);
          bool17 = true
            break;
          case '10':
          poly16 = L.polyline(coordinates, {color: color}).addTo(mapJS);
          bool16 = true
            break;
          case '11':
          poly14 = L.polyline(coordinates, {color: color}).addTo(mapJS);
          bool14 = true
            break;
          case '12':
          poly12 = L.polyline(coordinates, {color: color}).addTo(mapJS);
          bool12 = true
            break;
          default:
            break;
        }
        } catch (error) {
          console.error(error);
        }

      });
    }
    

    function cargarMapa(arrajson){
      L.geoJSON(arrajson, {
          style: function (feature) {
              return {color: feature.properties.color};
          }
      }).addTo(mapJS);
    }

    // EventClicks
    $('#rb').on('click',() => {
      if(boolRB){
        mapJS.removeLayer(polyRB)
        boolRB = !boolRB
      } else{
        mapJS.addLayer(polyRB)
        boolRB = !boolRB
      }
    })
